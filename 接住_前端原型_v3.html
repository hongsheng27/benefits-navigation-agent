<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接住 — 福利導航前端原型 v3（對話引導 + 即時備妥率）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#1a2229;--ink2:#414d58;--ink3:#6c7883;--ink4:#98a3ad;
 --line:#e5e9ed;--line2:#d3dae0;--bg:#f6f8f9;
 --teal:#0d7360;--teal-s:#e6f2ef;--teal-l:#c3e2d9;
 --slate:#3f5b73;--slate-s:#eaf0f5;
 --amber:#96660f;--amber-s:#fbf1de;--amber-l:#f0dcb4;
 --gray-s:#f1f3f5;--rose:#9e3a4e;--rose-s:#fbeef1;--rose-l:#f0d3da;
 --violet:#54479c;--violet-s:#eeecf8;--violet-l:#d9d3f0;
 --r:12px;--rs:8px;--rl:18px;
 --sh:0 1px 2px rgba(26,34,41,.04),0 3px 14px rgba(26,34,41,.05);
 --sh2:0 2px 8px rgba(26,34,41,.07),0 14px 36px rgba(26,34,41,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.78;
 font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.45}
button{font-family:inherit}
.hide{display:none!important}
.blank{color:var(--ink4);font-style:italic}
.deco{color:var(--ink4);font-size:13.5px}

.topbar{background:rgba(255,255,255,.9);backdrop-filter:blur(12px) saturate(180%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.tin{max-width:1180px;margin:0 auto;padding:0 30px;height:64px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.02em;white-space:nowrap;cursor:pointer}
.brand .mk{width:31px;height:31px;border-radius:9px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--ink4);letter-spacing:.14em;margin-top:-5px}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;overflow:hidden}
.cb{font-size:12.5px;color:var(--ink4);padding:5px 10px;border-radius:99px;white-space:nowrap;cursor:pointer;transition:.2s}
.cb.on{background:var(--teal-s);color:var(--teal);font-weight:700}
.cb.done{color:var(--ink3)}.cb.done:hover{background:var(--gray-s);color:var(--ink)}
.tact{display:flex;align-items:center;gap:9px;white-space:nowrap}
.sync{font-size:12px;color:var(--ink4);display:flex;align-items:center;gap:5px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.tbtn{font-size:13.5px;color:var(--ink2);background:#fff;border:1px solid var(--line2);border-radius:99px;padding:6px 14px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px}
.tbtn:hover{border-color:var(--teal);color:var(--teal)}
.tbtn.on{background:var(--teal-s);border-color:var(--teal-l);color:var(--teal);font-weight:700}
.av{width:26px;height:26px;border-radius:50%;background:var(--slate-s);color:var(--slate);font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center}

.wrap{max-width:1180px;margin:0 auto;padding:26px 30px 80px}
.backbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.back{background:#fff;border:1px solid var(--line2);border-radius:99px;padding:7px 16px;font-size:14px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s}
.back:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-s)}
.backbar .where{font-size:13px;color:var(--ink4)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);padding:34px 38px;animation:in .4s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.narrow{max-width:760px;margin:0 auto}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;margin-bottom:10px}
h2.title{font-size:27px;font-weight:900;letter-spacing:-.03em;margin-bottom:8px}
p.sub{color:var(--ink3);margin:0 0 24px;max-width:62ch}
.row{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px;align-items:center}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--r);padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#0a5f50;transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line2)}
.btn.ghost:hover{border-color:var(--ink3);color:var(--ink);background:#fafbfc}
.btn.violet{background:var(--violet)}.btn.violet:hover{background:#463b85}
.btn.danger{background:var(--rose)}.btn.danger:hover{background:#873041}
.btn.sm{padding:10px 18px;font-size:14.5px}
.t{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--teal-s);color:var(--teal)}
.t-info{background:var(--slate-s);color:var(--slate)}
.t-no{background:var(--gray-s);color:var(--ink3)}
.t-dead{background:var(--amber-s);color:var(--amber)}
.t-must{background:var(--rose-s);color:var(--rose)}
.t-my{background:var(--violet-s);color:var(--violet)}
.t-pend{background:var(--gray-s);color:var(--ink3)}

/* ---------- 首頁服務說明 ---------- */
.hero{background:#fff;border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden;margin-bottom:18px;animation:in .4s}
.herobanner{line-height:0}
.herobanner svg{width:100%;height:auto;display:block}
.herobody{padding:26px 30px 24px}
.heroh{font-size:25px;font-weight:900;letter-spacing:-.03em;line-height:1.42;margin-bottom:10px}
.herop{font-size:15.5px;color:var(--ink2);line-height:1.85;margin:0 0 20px;max-width:64ch}
.herohow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hh{display:flex;gap:12px;align-items:flex-start}
.hh .hhn{width:25px;height:25px;border-radius:50%;background:var(--teal-s);color:var(--teal);font-size:12.5px;
 font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.hh b{font-size:14.5px;font-weight:700;display:block;line-height:1.5}
.hh span:not(.hhn){font-size:12.5px;color:var(--ink3);line-height:1.6;display:block}
.herofoot{display:flex;gap:20px;flex-wrap:wrap;padding-top:16px}
.hf{font-size:12.5px;color:var(--ink3);line-height:1.6}
.hf b{display:block;font-size:13.5px;font-weight:900;color:var(--teal)}

/* ---------- 準備清單：頁首總覽卡 ---------- */
.dhcard{background:#fff;border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden;margin-bottom:14px;animation:in .4s}
.dhtop{padding:26px 30px 20px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dhname{font-size:29px;font-weight:900;letter-spacing:-.035em;line-height:1.3}
.dhorg{font-size:14px;color:var(--ink3);margin-top:4px}
.dhkey{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.dk{background:#fafbfc;padding:15px 20px}
.dk span{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink4);display:block;margin-bottom:3px}
.dk b{font-size:18px;font-weight:900;letter-spacing:-.02em;line-height:1.35;display:block}
.dk b.hl{color:var(--teal)}
.dk b i{font-size:12px;font-weight:500;font-style:normal;color:var(--ink3);letter-spacing:0;margin-left:5px}
.dhsec{padding:22px 30px;border-top:1px solid var(--line)}
.dhsec h4{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.dhn{background:var(--teal-s);color:var(--teal);border-radius:99px;font-size:11.5px;font-weight:700;padding:3px 11px}
/* ---------- 區塊跳轉 ---------- */
.jumpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px;padding:0 2px}
.jumpbar .jl{font-size:12.5px;color:var(--ink4);font-weight:700}
.jc{background:#fff;border:1px solid var(--line2);border-radius:99px;padding:6px 15px;font-size:13.5px;
 color:var(--ink2);text-decoration:none;transition:.18s}
.jc:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-s)}
/* ---------- 準備清單：完整說明 / 機關 / 步驟 ---------- */
.fulltext{font-size:15px;color:var(--ink2);line-height:1.9;text-align:justify}
.orgbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ob{background:#fafbfc;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ob .obl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink4);display:block;margin-bottom:3px}
.ob b{font-size:15px;font-weight:700;display:block;line-height:1.55}
.ob i{font-size:12.5px;color:var(--ink3);font-style:normal;display:block;margin-top:4px;line-height:1.55}
.apstep{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.apstep:last-child{border:none;padding-bottom:0}
.apstep .apn{width:27px;height:27px;border-radius:50%;background:var(--teal);color:#fff;font-size:13px;
 font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.apstep.key .apn{background:var(--amber)}
.apstep .apt{font-size:15.5px;font-weight:700;line-height:1.5;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.apstep .apd{font-size:13.5px;color:var(--ink3);line-height:1.75;margin-top:3px}
.oflink{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);
 margin-bottom:9px;cursor:pointer;transition:.18s;background:#fff;text-decoration:none}
.oflink:hover{border-color:var(--teal);background:var(--teal-s);transform:translateX(2px)}
.oflink .oln{font-size:14.5px;font-weight:700;color:var(--teal);flex:1;line-height:1.5}
.oflink .old{font-size:12.5px;color:var(--ink4);flex:0 0 auto;max-width:40%;text-align:right;line-height:1.5}
.oflink .olx{color:var(--teal);font-size:15px;flex:0 0 auto}
.docline .dn{font-size:14.5px;font-weight:500;line-height:1.5}
.dsrc{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.6}
.dsrc .dsl{background:var(--gray-s);border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;color:var(--ink4);margin-right:6px}
.dsrc a{color:var(--teal);font-weight:700;text-decoration:none;border-bottom:1px solid var(--teal-l);cursor:pointer}

/* ---------- 對話 ---------- */
.chatgrid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:22px;align-items:start}
.chatbox{background:#fff;border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);overflow:hidden}
.chd{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.chd .bot{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.chd b{font-size:15.5px;font-weight:900;display:block}
.chd span{font-size:12.5px;color:var(--ink4)}
.msgs{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:320px}
.m{display:flex;gap:11px;max-width:88%;animation:in .35s}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .ic{width:29px;height:29px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;margin-top:2px}
.m.ai .ic{background:var(--teal-s);color:var(--teal)}
.m.me .ic{background:var(--slate-s);color:var(--slate)}
.m .bb{border-radius:16px;padding:13px 17px;font-size:15.5px;line-height:1.72}
.m.ai .bb{background:var(--gray-s);border-top-left-radius:5px}
.m.me .bb{background:var(--teal);color:#fff;border-top-right-radius:5px}
.typing{display:flex;gap:4px;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink4);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.quick{padding:0 24px 14px;display:flex;flex-wrap:wrap;gap:8px}
.qc{background:#fff;border:1px solid var(--line2);border-radius:99px;padding:7px 15px;font-size:14px;cursor:pointer;color:var(--ink2);transition:.2s}
.qc:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-s)}
.inputbar{border-top:1px solid var(--line);padding:15px 24px;display:flex;gap:11px;align-items:flex-end;background:#fcfdfd}
.inputbar textarea{flex:1;min-height:48px;max-height:130px;border:1.5px solid var(--line2);border-radius:var(--r);padding:12px 15px;font-size:16px;font-family:inherit;line-height:1.6;resize:none;background:#fff}
.inputbar textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-s)}
.send{background:var(--teal);color:#fff;border:none;border-radius:var(--r);width:48px;height:48px;font-size:18px;cursor:pointer;flex:0 0 auto}
.send:hover{background:#0a5f50}
.mic{background:#fff;border:1.5px solid var(--line2);border-radius:var(--r);width:48px;height:48px;font-size:17px;cursor:pointer;flex:0 0 auto}
.mic:hover{border-color:var(--teal)}

.understand{position:sticky;top:88px;background:#fff;border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh);padding:20px 22px}
.understand h4{font-size:13px;letter-spacing:.07em;color:var(--ink4);font-weight:700;text-transform:uppercase;margin-bottom:12px}
.uev{font-size:19px;font-weight:900;letter-spacing:-.02em;color:var(--teal);margin-bottom:3px}
.uev.non{color:var(--ink4);font-size:15px;font-weight:400;font-style:italic}
.utags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.utag{background:var(--violet-s);color:var(--violet);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;animation:in .3s}
.udesc{font-size:13.5px;color:var(--ink3);line-height:1.7;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.confirmcard{border:1.5px solid var(--teal-l);background:var(--teal-s);border-radius:var(--r);padding:16px 18px;margin-top:14px}
.confirmcard p{margin:0 0 12px;font-size:14px;color:#0b5a4b;line-height:1.7}

/* ---------- 顯眼的確認區塊（對話頁） ---------- */
.bigconfirm{margin-top:16px;background:var(--teal);border-radius:var(--rl);padding:24px 28px;
 box-shadow:0 6px 24px rgba(13,115,96,.22);display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;animation:in .45s}
.bigconfirm .bcl{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:250px}
.bigconfirm .bci{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;flex:0 0 auto}
.bigconfirm b{color:#fff;font-size:18px;font-weight:900;display:block;letter-spacing:-.01em;line-height:1.5}
.bigconfirm span:not(.bci){color:rgba(255,255,255,.86);font-size:14px;display:block;margin-top:2px}
.bigconfirm .bcb{display:flex;gap:10px;flex-wrap:wrap}
.bigconfirm .btn{background:#fff;color:var(--teal);font-weight:900}
.bigconfirm .btn:hover{background:#f0faf7}
.bigconfirm .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.bigconfirm .btn.ghost:hover{background:rgba(255,255,255,.14);color:#fff;border-color:#fff}
/* ---------- 步驟 2：狀況解讀整頁 ---------- */
.interphero{background:var(--teal);border-radius:var(--rl);padding:32px 36px;display:flex;gap:26px;
 align-items:flex-start;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 26px rgba(13,115,96,.2);animation:in .4s}
.interphero .ihl{flex:1;min-width:280px}
.interphero .ihev{font-size:34px;font-weight:900;letter-spacing:-.035em;color:#fff;line-height:1.25;margin:2px 0 10px}
.interphero .ihs{font-size:15.5px;color:rgba(255,255,255,.9);line-height:1.75;max-width:56ch}
.interphero .ihs b{color:#fff;font-weight:700}
.interphero .ihr{text-align:center;background:rgba(255,255,255,.15);border-radius:var(--r);padding:18px 24px;flex:0 0 auto}
.interphero .ihcnt{font-size:42px;font-weight:900;color:#fff;letter-spacing:-.04em;line-height:1}
.interphero .ihr span{font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.5;display:block;margin-top:4px}
.utag.big{background:rgba(255,255,255,.2);color:#fff;font-size:14px;padding:6px 15px}
.ipcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
 padding:20px 22px;margin-bottom:13px;display:flex;gap:16px;align-items:flex-start;animation:in .4s}
.ipcard .ipn{width:30px;height:30px;border-radius:50%;background:var(--teal-s);color:var(--teal);
 font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.ipcard .ipb{flex:1;min-width:0}
.ipcard .ipt{font-size:17.5px;font-weight:900;letter-spacing:-.01em;line-height:1.5}
.ipcard .ipd{font-size:14.5px;color:var(--ink2);line-height:1.75;margin-top:5px}
.iprel{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line2)}
.iprel .irl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink4);display:block;margin-bottom:7px}
.iprel .irc{display:flex;flex-wrap:wrap;gap:7px}
.relchip{background:var(--teal-s);color:var(--teal);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:700}
.quote{background:var(--slate-s);border-left:3px solid var(--slate);border-radius:0 var(--rs) var(--rs) 0;
 padding:12px 15px;font-size:14.5px;color:#33455a;line-height:1.75;margin-bottom:9px}
.steplist{display:flex;flex-direction:column;gap:12px}
.sl{display:flex;gap:13px;align-items:flex-start}
.sl .sln{width:25px;height:25px;border-radius:50%;background:var(--gray-s);color:var(--ink3);
 font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:2px}
.sl b{font-size:15px;font-weight:700;display:block}
.sl span{font-size:13px;color:var(--ink3);line-height:1.6;display:block}

/* ---------- 媒合頁：問題主體 ---------- */
.askhero{background:#fff;border:2px solid var(--teal);border-radius:var(--rl);box-shadow:0 4px 22px rgba(13,115,96,.13);
 padding:28px 32px;margin-bottom:16px;animation:in .35s}
.askhero .ah{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.askhero .ahl{font-size:13px;font-weight:900;letter-spacing:.04em;color:var(--teal)}
.askhero .ahs{font-size:13.5px;color:var(--ink3);margin-top:2px;line-height:1.6}
.askhero .askcnt{font-size:26px;font-weight:900;color:var(--teal);letter-spacing:-.03em;line-height:1}
.askhero .askcnt small{font-size:14px;font-weight:500;color:var(--ink4)}
.askq{font-size:25px;font-weight:900;letter-spacing:-.025em;margin:18px 0 16px;line-height:1.4}
.askopts{display:flex;flex-wrap:wrap;gap:11px}
.ao{border:1.5px solid var(--line2);border-radius:var(--r);padding:15px 24px;font-size:17px;cursor:pointer;background:#fcfdfd;transition:.18s;font-weight:500}
.ao:hover{border-color:var(--teal);background:var(--teal-s);transform:translateY(-2px);box-shadow:0 3px 10px rgba(13,115,96,.12)}
.ao.pre{border-color:var(--violet);background:var(--violet-s);color:var(--violet);font-weight:700}

 var miss=(it.requires||[]).filter(function(c){return !ANS[c]||ANS[c]==='不確定';});
 if(miss.length)return {ok:false,why:'資料不足，尚無法估算'};
 var exact=S.mydata.authorized, wage=exact?WAGE_MYDATA:WAGE_DEFAULT;
 var k=nkids()||0, hh=nhh()||0;
 switch(it.id){
  case 'funeral':
   if(ANS.insured_type==='國民年金')
    return {ok:true,type:'once',amt:wage*3,note:'國保喪葬給付，示範以 3 個月計',exact:exact};
   return {ok:true,type:'once',amt:wage*5,note:'投保薪資 '+money(wage)+' × 5 個月',exact:exact};
  case 'survivor':
   var y=ANS.insured_years;
   var base=y==='15 年以上'?wage*0.30:(y==='5 – 15 年'?wage*0.22:wage*0.15);
   var add=Math.min(k,2)*0.25;
   return {ok:true,type:'monthly',months:null,amt:base*(1+add),
    note:'年資 '+y+(k?'　·　含 '+Math.min(k,2)+' 名子女加給':'　·　無加給'),exact:exact};
  case 'special':
   if(k<=0)return {ok:false,why:'無未成年子女，無子女生活津貼'};
   return {ok:true,type:'monthly',months:null,amt:5600*k,note:k+' 名子女 × '+money(5600),exact:true};
  case 'unemploy':
   if(ANS.employment!=='非自願離職')return {ok:false,why:'須為非自願離職才可請領'};
   return {ok:true,type:'monthly',months:6,amt:wage*0.6*(1+Math.min(k,2)*0.1),
    note:'投保薪資 60%'+(k?'　·　含眷屬加給 '+(Math.min(k,2)*10)+'%':'')+'　·　最長 6 個月',exact:exact};
  case 'relief':
   var a=hh>=4?40000:(hh===3?30000:(hh===2?20000:10000));
   return {ok:true,type:'once',amt:a,note:'依家戶 '+(hh||'—')+' 人核算，一次性核發',exact:true};
 }
 return {ok:false,why:'尚未設定估算規則'};}

 /* ── 區塊內快速跳轉 ── */
 var jump='<div class="jumpbar"><span class="jl">跳至</span>'+
  [['#j-verdict','判定原因'],['#j-steps','申請步驟'],['#j-docs','應備文件'],['#j-links','官方連結']]
   .map(function(j){return '<a class="jc" href="'+j[0]+'">'+j[1]+'</a>';}).join('')+'</div>';

 /* ── 區塊 B：左＝為什麼／步驟／連結　右＝文件 ── */
 var left=
  '<div class="sec" id="j-verdict"><h3>為什麼'+(v==='ok'?'可能符合':'還不能確認')+'</h3>'+
   '<div class="sd">'+it.reason+'</div>'+
   (S.explained?'<div class="plain" style="margin:12px 0 0"><div class="pl">白話說明</div>'+it.plain+'</div>'
    :'<button class="btn ghost sm" style="margin-top:12px" onclick="S.explained=true;go(4)">用白話再說一次</button>')+
   (miss.length?'<div class="rmiss" style="margin-top:12px">還需要確認：<b>'+miss.join('、')+'</b>'+
    '<div style="margin-top:10px"><button class="btn sm" onclick="go(3)">回去補答問題</button></div></div>':'')+
   '<div class="basis">判定依據：<span class="blank">'+it.basis+'</span>'+
   '<a onclick="toast(\'（示範）將開啟官方法規頁面\')">官方連結 ↗</a>'+
   (it.deadline?'<span class="t t-dead">'+it.deadline+'</span>':'')+'</div></div>'+
  '<div class="sec" id="j-steps"><h3>完整申請步驟 '+
   '<span class="t t-info">共 '+((AP.steps||[]).length)+' 步</span></h3>'+
   '<div class="sd">本站不代為送件，以下是你需要自行完成的流程。標示<b>前置步驟</b>的必須先完成，否則後面辦不下去。</div>'+
   (stepHtml||'<div class="deco">〈申請步驟待官方文件確認後填入〉</div>')+
   '<div class="kv" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">'+
   '<span>給付計算方式</span><b>'+it.amt+'</b></div></div>'+
  (linkHtml?'<div class="sec" id="j-links"><h3>官方資料來源與連結</h3>'+
   '<div class="sd">本頁所有說明都可以回到下列官方頁面核對。</div>'+linkHtml+'</div>':'');

 var right=
  '<div class="sec" id="j-docs"><h3>應備文件 <span class="t '+(r.p>=66?'t-ok':'t-info')+'">備妥 '+r.p+'%</span></h3>'+
   '<div class="sd">共 '+it.docs.length+' 項，其中 '+r.g+' 項可由系統自動備妥。</div>'+
   '<div class="rbar"><i class="'+(r.p>=66?'hi':(r.p>=33?'mid':'lo'))+'" style="width:'+r.p+'%"></i></div>'+
   '<div class="legend" style="margin:13px 0 4px;padding-bottom:12px;border-bottom:1px solid var(--line)">'+
   '<span><i style="background:var(--teal)"></i>帳戶帶入 '+a.filter(docReady).length+'/'+a.length+'</span>'+
   '<span><i style="background:var(--violet)"></i>MyData '+m.filter(docReady).length+'/'+m.length+'</span>'+
   '<span><i style="background:#dfe4e9"></i>自備 '+s.length+'</span></div>'+
   docHtml+'</div>'+
  (S.mydata.authorized?'':'<div class="mdcard"><span class="ic">🔐</span><div style="flex:1">'+
   '<h4>授權 MyData 可再備妥 '+m.length+' 項</h4>'+
   '<p>戶籍、所得、財產、勞保等官方證明可由你本人授權後自動取得，不必臨櫃調閱。</p>'+
   '<button class="btn violet sm" onclick="mydataAuth()">前往 MyData 授權</button></div></div>')+
  '<div class="sec"><h3>帶著這份清單去辦理</h3>'+
   '<div class="sd">建議印出來，或存成 PDF 存在手機裡。</div>'+
   '<div class="row" style="margin-top:0">'+
   '<button class="btn sm" onclick="window.print()">列印 / 存成 PDF</button>'+
   '<button class="btn ghost sm" onclick="toast(\'（示範）已下載預填申請表\')">下載預填表單</button></div></div>';

 return backbar('回媒合結果','go(3)','步驟 4 · 準備清單　·　共 '+ITEMS.length+' 項可能相關的補助')+
  head+jump+'<div class="dgrid"><div>'+left+'</div><div>'+right+'</div></div>'+
  notEligibleSection(it.id);}

/* 不符合 / 待補的項目也列出來，讓使用者知道不用為這些跑一趟 */
function notEligibleSection(curId){
 var no=ITEMS.filter(function(x){return x.id!==curId&&verdict(x)==='no';});
 var info=ITEMS.filter(function(x){return x.id!==curId&&(verdict(x)==='info'||verdict(x)==='pend');});
 if(!no.length&&!info.length)return '';
 var h='<div class="othersec">';
 if(no.length){
  h+='<div class="sechd" style="margin-top:0"><h3>不符合資格的項目 <span class="t t-no">'+no.length+' 項</span></h3>'+
   '<span class="deco" style="font-size:13px">這些你不需要準備文件，也不用為它們跑一趟</span></div>';
  h+=no.map(function(x){var nr=noReason(x);
   return '<div class="nocard"><div class="nch"><b>'+x.name+'</b>'+
    '<span class="t t-no">不符合</span></div>'+
    '<div class="ncorg">'+x.org+'</div>'+
    '<div class="ncwhy"><span class="ncl">差在這個條件</span>'+
    '<div class="ncc">'+(nr?nr.c:'〈條件名稱〉')+'</div>'+
    '<div class="ncv">你的情況：<b>'+(nr?nr.mine:'〈值〉')+'</b>　／　需要：<b>'+(nr?nr.need:'〈值〉')+'</b></div></div>'+
    '<div class="basis">依據：<span class="blank">'+x.basis+'</span>'+
    '<a onclick="event.stopPropagation();toast(\'（示範）將開啟官方法規頁面\')">官方連結 ↗</a>'+
    '<span class="blank">發布日期 〇</span></div>'+
    '<div class="ncfoot">如果你的情況之後有變化，可以回到<b>媒合與評估</b>重新回答，判定會即時更新。</div>'+
   '</div>';}).join('');}
 if(info.length){
  h+='<div class="sechd"><h3>尚未能判定的項目 <span class="t t-info">'+info.length+' 項</span></h3>'+
   '<span class="deco" style="font-size:13px">補齊條件後就能確認，先不用準備文件</span></div>';
  h+='<div class="infolist">'+info.map(function(x){
   var miss=(x.requires||[]).filter(function(c){return !ANS[c]||ANS[c]==='不確定';})
     .map(function(c){var f=Q.filter(function(y){return y.c===c;})[0];return f?f.l:c;});
   return '<div class="inforow"><div><b>'+x.name+'</b><span>'+x.org+'</span></div>'+
    '<div class="im">還缺：'+(miss.join('、')||'—')+'</div>'+
    '<button class="btn ghost sm" onclick="go(3)">回去補答</button></div>';}).join('')+'</div>';}
 return h+'<div class="row"><button class="btn ghost" onclick="go(3)">← 回媒合結果看全部項目</button></div></div>';}

/* ================== 我的資料 ================== */
function openMy(){S.step='my';el('btnMy').classList.add('on');crumbs(0);
 window.scrollTo({top:0,behavior:'smooth'});el('stage').innerHTML=viewMy();}
function counts(){var t=0,f=0,m=0;Object.keys(PROFILE).forEach(function(s){PROFILE[s].fields.forEach(function(x){
 t++;if(x.v)f++;if(x.src==='mydata')m++;});});return {t:t,f:f,m:m};}
function viewMy(){
 var c=counts();
 var nav=Object.keys(PROFILE).map(function(k){
  return '<a class="'+(S.mySection===k?'on':'')+'" onclick="S.mySection=\''+k+'\';openMy()">'+PROFILE[k].title+'</a>';}).join('')+
  '<a class="'+(S.mySection==='mydata'?'on':'')+'" onclick="S.mySection=\'mydata\';openMy()">MyData 授權</a>'+
  '<a class="'+(S.mySection==='privacy'?'on':'')+'" onclick="S.mySection=\'privacy\';openMy()">隱私與資料管理</a>';
 var body='';
 if(PROFILE[S.mySection]){var sec=PROFILE[S.mySection];
  body='<div class="sec"><h3>'+sec.title+'</h3><div class="sd">'+sec.desc+'</div>'+
  '<div class="legend" style="padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px">'+
  '<span><i style="background:var(--slate)"></i>自行填寫</span>'+
  '<span><i style="background:var(--violet)"></i>MyData 帶入</span>'+
  '<span><i style="background:var(--teal)"></i>系統推算</span></div>'+
  sec.fields.map(function(f){
   var sl={self:['src-self','自行填寫'],mydata:['src-my','MyData'],calc:['src-calc','系統推算']}[f.src];
   return '<div class="fld"><div class="fl"><b>'+f.l+'</b><span>'+f.w+'</span></div>'+
    '<div class="fr"><span class="fv'+(f.v?'':' none')+'">'+(f.v||'尚未填寫')+'</span>'+
    '<span class="src '+sl[0]+'">'+sl[1]+'</span>'+
    (f.src==='calc'?'':'<button class="edit" onclick="editP(\''+S.mySection+'\',\''+f.c+'\')">修改</button>')+
    '</div></div>';}).join('')+'</div>';}
 else if(S.mySection==='mydata'){
  body='<div class="sec"><h3>MyData 授權狀態 '+(S.mydata.authorized?'<span class="t t-my">已授權</span>':'<span class="t t-pend">尚未授權</span>')+'</h3>'+
  '<div class="sd">'+(S.mydata.authorized?'授權時間 '+S.mydata.at+'　·　有效期至 '+S.mydata.expires+'。資料已存入你的帳戶，下次諮詢不需重填。'
   :'授權後可自動取得所得、財產、勞保、戶籍等官方資料，省去臨櫃調閱，也讓備妥率大幅提升。')+'</div>'+
  MYSETS.map(function(d){var p=findP(d.f);
   return '<div class="fld"><div class="fl"><b>'+d.n+'</b><span>'+d.o+'　→　'+(p?p.f.l:d.f)+'</span></div>'+
   '<div class="fr">'+(S.mydata.authorized?'<span class="src src-my">已取得</span>':'<span class="src src-self">未取得</span>')+'</div></div>';}).join('')+
  '<div class="row">'+(S.mydata.authorized
   ?'<button class="btn ghost sm" onclick="mydataAuth();setTimeout(openMy,700)">重新授權更新資料</button>'+
    '<button class="btn danger sm" onclick="revoke()">撤回授權並刪除帶入資料</button>'
   :'<button class="btn violet" onclick="mydataAuth();setTimeout(openMy,800)">前往 MyData 授權</button>')+'</div></div>'+
  '<div class="privacy"><span>🔐</span><div>接住以<b>服務提供者</b>身分介接 MyData，所有資料都由你本人在官方平台單次同意後傳送。我們不會、也無法主動查詢你的任何資料。</div></div>';}
 else{
  body='<div class="sec"><h3>你的資料存在哪裡</h3>'+
  '<div class="sd">為了讓你下次不用重填、也能追蹤準備進度，這些資料儲存在接住的資料庫中，與你的帳戶綁定。</div>'+
  '<div class="fld"><div class="fl"><b>儲存位置</b><span>接住服務資料庫（加密儲存）</span></div><div class="fr"><span class="fv">帳戶綁定</span></div></div>'+
  '<div class="fld"><div class="fl"><b>帳戶識別碼</b><span>系統內部使用</span></div><div class="fr"><span class="fv">'+S.account.id+'</span></div></div>'+
  '<div class="fld"><div class="fl"><b>最後更新</b><span>任何欄位變更都會即時同步</span></div><div class="fr"><span class="fv">'+S.account.last+'</span></div></div>'+
  '<div class="fld"><div class="fl"><b>MyData 資料有效期</b><span>期滿自動失效，需重新授權</span></div>'+
  '<div class="fr"><span class="fv">'+(S.mydata.authorized?'至 '+S.mydata.expires:'無')+'</span></div></div></div>'+
  '<div class="sec"><h3>你可以做的事</h3><div class="sd">資料是你的，隨時可以帶走或刪除。</div>'+
  '<div class="row" style="margin-top:0"><button class="btn ghost sm" onclick="toast(\'（示範）已匯出個人資料 JSON\')">下載我的所有資料</button>'+
  '<button class="btn ghost sm" onclick="toast(\'（示範）已產生資料使用紀錄\')">查看資料使用紀錄</button></div></div>'+
  '<div class="dangerzone"><h3>刪除我的資料</h3>'+
  '<p>會從資料庫永久刪除你填寫的所有個人資料、MyData 帶入內容與歷次諮詢紀錄。此動作無法復原。</p>'+
  '<button class="btn danger sm" onclick="wipe()">永久刪除我的資料</button></div>';}

 return backbar('回到流程','go('+(S.confirmed?3:1)+')','我的資料')+
 '<div class="acct"><span class="big">李</span><div class="ai"><b>'+S.account.name+'</b>'+
 '<span>接住帳戶 · 自 '+S.account.since+' 起使用</span></div>'+
 '<span class="saved">✓ 已儲存至你的帳戶 · '+S.account.last+'</span></div>'+
 '<div class="sumrow"><div class="stat"><b>'+c.f+' / '+c.t+'</b><span>已填寫欄位</span></div>'+
 '<div class="stat"><b style="color:var(--violet)">'+(S.mydata.authorized?c.m:0)+'</b><span>MyData 帶入</span></div>'+
 '<div class="stat"><b style="color:var(--teal)">'+Math.round(c.f/c.t*100)+'%</b><span>資料完整度</span></div>'+
 '<div class="stat"><b>'+Object.keys(ANS).length+'</b><span>本次已答問題</span></div></div>'+
 '<div class="mywrap"><nav class="mynav">'+nav+'</nav><div>'+body+'</div></div>';}

function editP(sec,code){var f=P(sec,code);
 if(!f.opts){el('modalLayer').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="mbox">'+
  '<h3>修改「'+f.l+'」</h3><p>'+f.w+'</p>'+
  '<input id="mv" value="'+(f.v||'')+'" style="width:100%;border:1.5px solid var(--line2);border-radius:var(--r);padding:12px 15px;font-size:16px;font-family:inherit">'+
  '<div class="row" style="margin-top:16px"><button class="btn sm" onclick="saveP(\''+sec+'\',\''+code+'\',el(\'mv\').value)">儲存</button>'+
  '<button class="btn ghost sm" onclick="closeModal()">取消</button></div></div></div>';return;}
 el('modalLayer').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="mbox">'+
 '<h3>修改「'+f.l+'」</h3><p>'+f.w+'</p>'+
 f.opts.map(function(o){return '<div class="mopt'+(o===f.v?' cur':'')+'" onclick="saveP(\''+sec+'\',\''+code+'\',\''+o+'\')">'+o+'</div>';}).join('')+
 '<div class="row" style="margin-top:12px"><button class="btn ghost sm" onclick="closeModal()">取消</button></div></div></div>';}
function saveP(sec,code,v){var f=P(sec,code);f.v=v;if(f.src==='mydata')f.src='self';
 closeModal();saveDB('已更新並同步至你的帳戶');setTimeout(openMy,300);}
function closeModal(){el('modalLayer').innerHTML='';}
function revoke(){S.mydata={authorized:false,at:null,expires:null};
 Object.keys(PROFILE).forEach(function(s){PROFILE[s].fields.forEach(function(f){if(f.src==='mydata'){f.v='';f.src='self';}});});
 saveDB('已撤回 MyData 授權並刪除帶入的資料');setTimeout(openMy,300);}
function wipe(){Object.keys(PROFILE).forEach(function(s){PROFILE[s].fields.forEach(function(f){f.v='';f.src='self';});});
 ANS={};S.mydata={authorized:false,at:null,expires:null};resetChat();
 saveDB('已從資料庫永久刪除你的所有資料');}

go(1);
</script>
</body>
</html>
