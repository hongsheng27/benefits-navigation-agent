[project]
name = "jiezhu-backend"
version = "0.1.0"
description = "接住 benefits navigation backend"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.62",
    "fastapi>=0.115",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.2.6",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "hypothesis==6.156.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# "." lets the app's own tests import `app.*`. ".." is the repository root,
# which the data layer tests need because they import `backend.app.*` and
# `scripts.*`. Without it, collecting the whole suite fails and the tests have
# to be listed by hand.
pythonpath = [".", ".."]
testpaths = ["tests"]
